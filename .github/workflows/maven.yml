name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 27
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '27-ea'
    - name: Build with Maven
      run: ./mvnw -B clean package
